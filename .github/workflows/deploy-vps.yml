name: Deploy TourBoard to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tourboard-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create release ZIP
        run: git archive --format=zip --output=tourboard_${GITHUB_SHA}.zip ${GITHUB_SHA}
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          RELEASE_ZIP: tourboard_${{ github.sha }}.zip
        run: |
          PORT="${VPS_PORT:-22}"
          REMOTE_ARCHIVE="/opt/tourboard/releases/${RELEASE_ZIP}"
          scp -P "$PORT" "$RELEASE_ZIP" "${VPS_USER}@${VPS_HOST}:${REMOTE_ARCHIVE}"
          ssh -p "$PORT" "${VPS_USER}@${VPS_HOST}" "bash /opt/tourboard/deploy.sh '${REMOTE_ARCHIVE}'"
