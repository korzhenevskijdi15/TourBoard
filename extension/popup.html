<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Моя подборка</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div class="logo" id="companyLogoWrap"><img id="companyLogo" alt="" hidden>✈</div><div class="brand"><strong class="brand-line"><span id="companyName">Рюкзак путешествий</span><span class="brand-separator">|</span><span id="managerName">Менеджер</span></strong><small>Туры с Дельфина</small></div><button id="cabinet" class="cabinet-button" title="Открыть веб-кабинет">В личный кабинет</button></header>
<main><label class="collection-title-label">Название подборки
<input id="collectionTitle" class="edit-field" value="Моя подборка" placeholder="Например: Абхазия, август 2027">
</label>
<div class="top"><span id="count">0 предложений</span><button id="clear" class="text">Очистить</button></div><div id="list"></div><div id="empty" class="empty">Откройте страницу предложения на Delfin-tour.ru или Alean.ru и нажмите «＋ В подборку» рядом с ценой.</div></main>
<div id="clientModal" class="client-modal" hidden><div class="client-modal-card" role="dialog" aria-modal="true" aria-labelledby="clientModalTitle"><h2 id="clientModalTitle">Выберите клиента</h2><p class="client-modal-hint">Подборка будет связана с выбранным клиентом.</p><label class="client-modal-label">Клиент<select id="saveClientSelect"><option value="">Загружаем клиентов…</option></select></label><div class="client-modal-actions"><button type="button" id="showCreateClient" class="secondary">+ Создать клиента</button><button type="button" id="confirmSaveCollection" class="primary" disabled>Сохранить подборку</button></div><form id="popupCreateClientForm" hidden><label>Имя клиента<input name="name" maxlength="150" placeholder="Имя клиента"></label><label>Телефон<input name="phone" type="tel" maxlength="80" placeholder="+7 …"></label><label>Email<input name="email" type="email" maxlength="150" placeholder="client@example.ru"></label><div class="client-modal-actions"><button type="submit" class="secondary">Сохранить клиента</button><button type="button" id="cancelPopupCreateClient" class="secondary">Отмена</button></div></form><button type="button" id="cancelClientModal" class="text client-modal-cancel">Отмена сохранения</button><div id="clientModalStatus" role="status"></div></div></div>
<footer><button id="save" class="primary">Сохранить</button>
<small id="saveStatus">Версия 0.16.4 · подборка привязывается к клиенту</small></footer>
<script src="popup.js"></script></body></html>
