<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Tour Selection</title><link rel="stylesheet" href="/style.css"><style>
.auth-wrap{max-width:440px;margin:8vh auto;padding:0 18px}.auth-card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:30px;box-shadow:0 16px 45px rgba(16,40,59,.09)}.auth-card h1{margin:0 0 8px;color:#10283b}.auth-card p{color:#667789;line-height:1.5}.auth-card label{display:block;margin:16px 0;font-weight:600}.auth-card input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #cfd8e2;border-radius:10px;font:inherit}.auth-card button{width:100%;margin-top:12px}.auth-error{color:#a32626;margin-top:12px;min-height:22px}.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.auth-brand .mark{font-size:28px;color:#fff;background:#10283b;border-radius:12px;padding:10px}.auth-small{font-size:12px;color:#738191}
</style> <link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head><body><main class="auth-wrap"><div class="auth-brand"><div class="mark">✈</div><div><strong>Tour Selection</strong><div class="auth-small">Кабинет менеджера</div></div></div><section class="auth-card"><h1>Вход в кабинет</h1><p>Введите логин и пароль, выданные администратором.</p><form id="loginForm"><label>Логин<input name="username" autocomplete="username" required maxlength="40"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Войти</button><div id="error" class="auth-error" aria-live="polite"></div></form></section></main><script>
(async()=>{const status=await fetch("/api/auth/status").then(r=>r.json());if(status.setupRequired){location.replace("/setup");return}const me=await fetch("/api/auth/me");if(me.ok){location.replace("/cabinet");return}document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget),error=document.getElementById("error");error.textContent="Проверяем данные…";try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:f.get("username"),password:f.get("password")})}),d=await r.json();if(!r.ok)throw Error(d.error||"Не удалось войти");location.replace("/cabinet")}catch(err){error.textContent=err.message}})})();
</script></body></html>
